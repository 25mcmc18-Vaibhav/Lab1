<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyCast Weather</title>
    <link rel="stylesheet" href="task7.css">
</head>
<body>

    <main class="weather-card">
        <header>
            <h2>Weather</h2>
        </header>

        <div class="search-container">
            <input type="text" id="city-search" placeholder="City Name">
            <button id="search-trigger">Search</button>
        </div>

        <div id="weather-display" class="output-area">
            <p class="placeholder-text">Enter a city to see the weather.</p>
        </div>
    </main>

    <script src="task7.js"></script>
</body>
</html>
