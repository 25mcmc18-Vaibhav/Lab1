<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book Catalog Manager</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>

    <div class="container">
        <h1 id="title">Book Catalog</h2>

        <div class="controls">
            <div class="filter-group">
                <label>Search Title:</label>
                <input type="text" id="titleFilter" placeholder="Enter book title...">
            </div>

            <div class="filter-group">
                <label>Genre:</label>
                <select id="genreFilter">
                    <option value="All">All Genres</option>
                    <option value="Classic">Classic</option>
                    <option value="Fantasy">Fantasy</option>
                    <option value="Sci-Fi">Sci-Fi</option>
                    <option value="Horror">Horror</option>
                </select>
            </div>

            <div class="filter-group">
                <label>Max Price:</label>
                <input type="number" id="priceFilter" placeholder="Max &#8377;">
            </div>

            <div class="filter-group">
                <label>Author:</label>
                <input type="text" id="authorFilter" placeholder="Search author...">
            </div>

            <div class="filter-group button-group">
                <label>&nbsp;</label>
                <button id="applyFiltersBtn">Apply Filters</button>
            </div>
        </div>

        <table id="bookTable">
            <thead>
                <tr>
                    <th>Title</th>
                    <th>Author</th>
                    <th>Genre</th>
                    <th>Price</th>
                    <th>Published</th>
                </tr>
            </thead>
            <tbody>
                </tbody>
        </table>
    </div>

    <script src="script.js"></script>
</body>
</html>
